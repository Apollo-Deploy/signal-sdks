name: Publish Signal SDKs
run-name: Publish Signal SDKs for ${{ github.event.release.tag_name || inputs.release_tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Signal GitHub release tag in vSemVer form
        required: true
        type: string
      r2_scope:
        description: R2 objects to publish or repair
        required: true
        default: all
        type: choice
        options:
          - all
          - cli
          - none
      package_scope:
        description: Native ecosystem packages to publish or repair
        required: true
        default: all
        type: choice
        options:
          - all
          - npm
          - pypi
          - rubygems
          - maven
          - nuget
          - crates
          - hex
          - none

concurrency:
  group: signal-sdk-release
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release_context:
    if: github.repository == 'Apollo-Deploy/signal-sdks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      package_scope: ${{ steps.release.outputs.package_scope }}
      r2_scope: ${{ steps.release.outputs.r2_scope }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      sdk_version: ${{ steps.release.outputs.sdk_version }}
      source_commit: ${{ steps.release.outputs.source_commit }}
    steps:
      - name: Check out the exact public SDK release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Validate the governed public SDK release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REQUESTED_PACKAGE_SCOPE: ${{ github.event_name == 'release' && 'all' || inputs.package_scope }}
          REQUESTED_R2_SCOPE: ${{ github.event_name == 'release' && 'all' || inputs.r2_scope }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Public SDK releases require a v-prefixed SemVer tag without build metadata." >&2
            exit 1
          fi
          if [[ "$REQUESTED_R2_SCOPE" != "all" && \
            "$REQUESTED_R2_SCOPE" != "cli" && \
            "$REQUESTED_R2_SCOPE" != "none" ]]; then
            echo "R2 scope must be all, cli, or none." >&2
            exit 1
          fi
          case "$REQUESTED_PACKAGE_SCOPE" in
            all|npm|pypi|rubygems|maven|nuget|crates|hex|none) ;;
            *)
              echo "Package scope is not a supported ecosystem publisher." >&2
              exit 1
              ;;
          esac

          release_json="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName
          )"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and .isDraft == false' \
            <<< "$release_json" >/dev/null

          source_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse HEAD)" != "$source_commit" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$GITHUB_SHA" != "$source_commit" ]]; then
            echo "Release event commit does not match the release tag." >&2
            exit 1
          fi

          sdk_version="${RELEASE_TAG#v}"
          if [[ ! -f VERSION || "$(< VERSION)" != "$sdk_version" ]]; then
            echo "Generated repository VERSION does not match $RELEASE_TAG." >&2
            exit 1
          fi
          if [[ "$(find sdks -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" -ne 15 ]]; then
            echo "Generated repository does not contain all 15 SDK directories." >&2
            exit 1
          fi
          private_repository='Apollo-Deploy/Apollo-Signal-'API
          if grep -R -F "$private_repository" . \
            --exclude-dir=.git >/dev/null 2>&1; then
            echo "Public SDK release contains a private source-repository reference." >&2
            exit 1
          fi

          artifact_name="apollo-signal-sdk-$RELEASE_TAG"
          {
            echo "artifact_name=$artifact_name"
            echo "package_scope=$REQUESTED_PACKAGE_SCOPE"
            echo "r2_scope=$REQUESTED_R2_SCOPE"
            echo "release_tag=$RELEASE_TAG"
            echo "sdk_version=$sdk_version"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Download the immutable public release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          assets="$RUNNER_TEMP/apollo-signal-sdk-release-assets"
          mkdir -p "$assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$assets"

      - name: Verify and prepare the publisher inputs
        env:
          SDK_VERSION: ${{ steps.release.outputs.sdk_version }}
        run: |
          assets="$RUNNER_TEMP/apollo-signal-sdk-release-assets"
          scripts/prepare-sdk-publisher-assets.sh \
            --assets "$assets" \
            --version "$SDK_VERSION"

      - name: Store verified publisher inputs on this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets
          if-no-files-found: error
          retention-days: 30

  publisher-preflight:
    needs: release_context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate repository secret contracts before publication
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
          PACKAGE_SCOPE: ${{ needs.release_context.outputs.package_scope }}
          R2_SCOPE: ${{ needs.release_context.outputs.r2_scope }}
          SIGNAL_SDK_R2_ACCESS_KEY_ID: ${{ secrets.SIGNAL_SDK_R2_ACCESS_KEY_ID }}
          SIGNAL_SDK_R2_BUCKET: ${{ secrets.SIGNAL_SDK_R2_BUCKET }}
          SIGNAL_SDK_R2_ENDPOINT: ${{ secrets.SIGNAL_SDK_R2_ENDPOINT }}
          SIGNAL_SDK_R2_PUBLIC_BASE_URL: ${{ secrets.SIGNAL_SDK_R2_PUBLIC_BASE_URL }}
          SIGNAL_SDK_R2_SECRET_ACCESS_KEY: ${{ secrets.SIGNAL_SDK_R2_SECRET_ACCESS_KEY }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_ID: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          require_secret() {
            local name="$1"
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is not configured: $name" >&2
              exit 1
            fi
          }

          if [[ "$R2_SCOPE" != "none" ]]; then
            require_secret SIGNAL_SDK_R2_ACCESS_KEY_ID
            require_secret SIGNAL_SDK_R2_BUCKET
            require_secret SIGNAL_SDK_R2_ENDPOINT
            require_secret SIGNAL_SDK_R2_SECRET_ACCESS_KEY
          fi
          if [[ "$R2_SCOPE" == "all" ]]; then
            require_secret SIGNAL_SDK_R2_PUBLIC_BASE_URL
          fi
          if [[ "$PACKAGE_SCOPE" == "all" || "$PACKAGE_SCOPE" == "npm" ]]; then
            for package in @apollo-deploy/signal-sdk @apollo-deploy/signal-cli; do
              if ! npm view "$package" version \
                --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                if [[ -z "$BOOTSTRAP_NPM_TOKEN" ]]; then
                  echo "Required repository secret is not configured: NPM_TOKEN" >&2
                  exit 1
                fi
              fi
            done
          fi
          if [[ "$PACKAGE_SCOPE" == "all" || "$PACKAGE_SCOPE" == "maven" ]]; then
            require_secret MAVEN_CENTRAL_USERNAME
            require_secret MAVEN_CENTRAL_PASSWORD
            require_secret SIGNING_IN_MEMORY_KEY
            require_secret SIGNING_IN_MEMORY_KEY_ID
            require_secret SIGNING_IN_MEMORY_KEY_PASSWORD
          fi
          if [[ "$PACKAGE_SCOPE" == "all" || "$PACKAGE_SCOPE" == "nuget" ]]; then
            require_secret NUGET_USER
          fi
          if [[ "$PACKAGE_SCOPE" == "all" || "$PACKAGE_SCOPE" == "crates" ]]; then
            require_secret CARGO_REGISTRY_TOKEN
          fi
          if [[ "$PACKAGE_SCOPE" == "all" || "$PACKAGE_SCOPE" == "hex" ]]; then
            require_secret HEX_API_KEY
          fi

  publish-r2:
    if: needs.release_context.outputs.r2_scope != 'none'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Publish immutable downloads to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SIGNAL_SDK_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SIGNAL_SDK_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          AWS_PAGER: ""
          AWS_REGION: auto
          SDK_R2_BUCKET: ${{ secrets.SIGNAL_SDK_R2_BUCKET }}
          SDK_R2_ENDPOINT: ${{ secrets.SIGNAL_SDK_R2_ENDPOINT }}
          SDK_R2_PUBLIC_BASE_URL: ${{ secrets.SIGNAL_SDK_R2_PUBLIC_BASE_URL }}
        run: |
          scripts/publish-sdk-release-to-r2.sh \
            --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
            --version "${{ needs.release_context.outputs.sdk_version }}" \
            --scope "${{ needs.release_context.outputs.r2_scope }}"

  publish-npm:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'npm'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up the npm trusted-publishing runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      - name: Build, inspect, and publish the TypeScript SDK and CLI
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          npm install --global npm@11.5.1
          cleanup_npm_auth() {
            npm config delete \
              --location=user \
              //registry.npmjs.org/:_authToken >/dev/null 2>&1 || true
          }
          trap cleanup_npm_auth EXIT

          npm_tag=latest
          if [[ "$SDK_VERSION" == *-* ]]; then
            npm_tag=next
          fi

          for target in typescript cli; do
            package_dir="$RUNNER_TEMP/npm-$target"
            scripts/extract-sdk-release-target.sh \
              --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
              --target "$target" \
              --output "$package_dir" \
              --version "$SDK_VERSION"
            (
              cd "$package_dir"
              npm install --ignore-scripts --no-audit --no-fund
              npm run build
              npm pack --dry-run

              package_name="$(jq -r '.name' package.json)"
              if npm view "$package_name" version \
                --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                npm publish --access public --tag "$npm_tag"
              else
                if [[ -z "$BOOTSTRAP_NPM_TOKEN" ]]; then
                  echo "NPM_TOKEN is required for the first publication of $package_name." >&2
                  exit 1
                fi
                npm config set \
                  --location=user \
                  //registry.npmjs.org/:_authToken \
                  "$BOOTSTRAP_NPM_TOKEN"
                npm publish --access public --tag "$npm_tag"
                cleanup_npm_auth
              fi
            )
          done

  publish-pypi:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'pypi'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build and validate the PyPI distributions
        env:
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          package_dir="$RUNNER_TEMP/python"
          scripts/extract-sdk-release-target.sh \
            --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
            --target python \
            --output "$package_dir" \
            --version "$SDK_VERSION"
          python -m pip install --disable-pip-version-check build twine
          python -m build --outdir "$package_dir/dist" "$package_dir"
          python -m twine check "$package_dir"/dist/*

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ runner.temp }}/python/dist/

  publish-rubygems:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'rubygems'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      - name: Build and validate the Ruby and Rails gems
        env:
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/gems"
          for target in ruby rails; do
            package_dir="$RUNNER_TEMP/$target"
            scripts/extract-sdk-release-target.sh \
              --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
              --target "$target" \
              --output "$package_dir" \
              --version "$SDK_VERSION"
            gemspec="$(find "$package_dir" -maxdepth 1 -type f -name '*.gemspec')"
            if [[ "$(wc -l <<< "$gemspec" | tr -d ' ')" -ne 1 ]]; then
              echo "Expected one gemspec for $target." >&2
              exit 1
            fi
            (
              cd "$package_dir"
              gem build --output "$RUNNER_TEMP/gems/$target-$SDK_VERSION.gem" \
                "$(basename "$gemspec")"
            )
          done

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish the Ruby and Rails gems
        run: |
          for package in "$RUNNER_TEMP"/gems/*.gem; do
            gem push "$package"
          done

  publish-maven:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'maven'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      POM_DEVELOPER_ID: apollo-deploy
      POM_DEVELOPER_NAME: Apollo Deploy
      POM_SCM_CONNECTION: scm:git:https://github.com/Apollo-Deploy/signal-sdks.git
      POM_SCM_DEVELOPER_CONNECTION: scm:git:ssh://git@github.com/Apollo-Deploy/signal-sdks.git
      POM_SCM_URL: https://github.com/Apollo-Deploy/signal-sdks
      POM_URL: https://github.com/Apollo-Deploy/signal-sdks
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.2.1"

      - name: Build, sign, and publish Java and Kotlin to Maven Central
        env:
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          for target in java kotlin; do
            package_dir="$RUNNER_TEMP/$target"
            scripts/extract-sdk-release-target.sh \
              --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
              --target "$target" \
              --output "$package_dir" \
              --version "$SDK_VERSION"
            gradle --project-dir "$package_dir" build --no-daemon
          done
          for target in java kotlin; do
            gradle \
              --project-dir "$RUNNER_TEMP/$target" \
              publishAndReleaseToMavenCentral \
              --no-daemon
          done

  publish-nuget:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'nuget'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and validate the NuGet package
        env:
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          package_dir="$RUNNER_TEMP/dotnet"
          scripts/extract-sdk-release-target.sh \
            --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
            --target dotnet \
            --output "$package_dir" \
            --version "$SDK_VERSION"
          dotnet restore "$package_dir/ApolloSignalApi.csproj"
          dotnet pack \
            "$package_dir/ApolloSignalApi.csproj" \
            --configuration Release \
            --no-restore \
            --output "$RUNNER_TEMP/nuget-packages" \
            -p:ContinuousIntegrationBuild=true

      - name: Request a temporary NuGet API key
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          packages=("$RUNNER_TEMP"/nuget-packages/*.nupkg)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one NuGet package." >&2
            exit 1
          fi
          dotnet nuget push "${packages[0]}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

  publish-crates:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'crates'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Package and publish the Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          package_dir="$RUNNER_TEMP/rust"
          scripts/extract-sdk-release-target.sh \
            --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
            --target rust \
            --output "$package_dir" \
            --version "$SDK_VERSION"
          cargo check --manifest-path "$package_dir/Cargo.toml"
          cargo package --manifest-path "$package_dir/Cargo.toml"
          cargo publish --manifest-path "$package_dir/Cargo.toml"

  publish-hex:
    if: needs.release_context.outputs.package_scope == 'all' || needs.release_context.outputs.package_scope == 'hex'
    needs: [release_context, publisher-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out trusted release-publishing tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.release_context.outputs.source_commit }}

      - name: Download the verified release package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.release_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/apollo-signal-sdk-release-assets

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Build and publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          SDK_VERSION: ${{ needs.release_context.outputs.sdk_version }}
        run: |
          package_dir="$RUNNER_TEMP/elixir"
          scripts/extract-sdk-release-target.sh \
            --assets "$RUNNER_TEMP/apollo-signal-sdk-release-assets" \
            --target elixir \
            --output "$package_dir" \
            --version "$SDK_VERSION"
          (
            cd "$package_dir"
            mix local.hex --force
            mix deps.get
            mix compile --warnings-as-errors
            mix hex.build
            mix hex.publish --yes
          )
