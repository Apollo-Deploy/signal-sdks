[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-deploy-signal-sdk"
version = "1.0.5"
description = "Python SDK for Apollo Signal API"
authors = [{name = "Apollo Deploy"}]
keywords = ["apollo", "signal", "email", "sdk"]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["apollo_deploy_signal_sdk*"]

[tool.setuptools.data-files]
"." = ["README.md", "LICENSE"]
"docs" = ["docs/*.md"]
"docs/domains" = ["docs/domains/*.md"]

[project.urls]
Homepage = "https://github.com/Apollo-Deploy/signal-sdks"
Repository = "https://github.com/Apollo-Deploy/signal-sdks"
Issues = "https://github.com/Apollo-Deploy/signal-sdks/issues"
