[package]
name = "apollo-signal-sdk"
version = "1.0.4"
edition = "2021"
description = "Rust SDK for Apollo Signal API"
license = "MIT"
repository = "https://github.com/Apollo-Deploy/signal-sdks"
homepage = "https://github.com/Apollo-Deploy/signal-sdks"
readme = "README.md"
keywords = ["apollo", "signal", "email", "sdk"]
categories = ["api-bindings", "email"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
url = "2"
urlencoding = "2"
httpdate = "1"
futures-core = "0.3"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
